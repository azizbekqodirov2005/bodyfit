<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BodyFit — JSST standartlari asosida tana massasi indeksi (BMI) tahlili. Kattalar, bolalar va o'smirlar uchun." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a1220" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>BodyFit — JSST standartlari asosida BMI tahlili</title>
    <script>
      // Apply the saved theme before first paint (only the theme is stored).
      (function () {
        try {
          var t = localStorage.getItem('bodyfit-theme');
          if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <noscript>BodyFit ishlashi uchun brauzeringizda JavaScript yoqilgan bo'lishi kerak.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
